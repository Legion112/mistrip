<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#15171e"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#ff3b30"/>
      <stop offset="0.20" stop-color="#ff9500"/>
      <stop offset="0.40" stop-color="#ffd60a"/>
      <stop offset="0.60" stop-color="#34c759"/>
      <stop offset="0.80" stop-color="#0a84ff"/>
      <stop offset="1.00" stop-color="#bf5af2"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-120%" width="220%" height="340%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- the light spilling off the strip -->
  <g filter="url(#glow)" opacity="0.55">
    <rect x="30" y="112" width="196" height="32" rx="16" fill="url(#strip)"/>
  </g>

  <!-- the strip itself, with its 10 cm segments -->
  <rect x="30" y="114" width="196" height="28" rx="14" fill="url(#strip)"/>
  <g fill="#15171e" opacity="0.32">
    <rect x="62"  y="114" width="3" height="28"/>
    <rect x="94"  y="114" width="3" height="28"/>
    <rect x="126" y="114" width="3" height="28"/>
    <rect x="158" y="114" width="3" height="28"/>
    <rect x="190" y="114" width="3" height="28"/>
  </g>

  <!-- specular highlight along the top edge -->
  <rect x="34" y="118" width="188" height="7" rx="4" fill="#ffffff" opacity="0.26"/>

  <!-- wifi arcs: control is over the network, not a cable -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.85">
    <path d="M100 76 a40 40 0 0 1 56 0" stroke-width="11"/>
    <path d="M114 58 a58 58 0 0 1 28 0" stroke-width="0"/>
  </g>
  <circle cx="128" cy="90" r="8" fill="#ffffff" opacity="0.9"/>
</svg>
